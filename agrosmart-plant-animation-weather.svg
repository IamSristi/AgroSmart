<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sunGlowFilter" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cloudBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="rainGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2EE6A6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2EE6A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="potGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f4b"/>
      <stop offset="100%" stop-color="#20232a"/>
    </linearGradient>

    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6D8"/>
      <stop offset="55%" stop-color="#FFD36E"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD36E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD36E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF0F7"/>
      <stop offset="100%" stop-color="#C7D2DE"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EE6A6" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#7FD8FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2EE6A6" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- ===================== SUN (fades in, glows, then fades out) ===================== -->
  <g id="sun-group" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.042;0.417;0.483;1" dur="12s" repeatCount="indefinite"/>

    <circle cx="72" cy="58" r="44" fill="url(#sunHalo)" filter="url(#sunGlowFilter)">
      <animate attributeName="r" values="40;48;40" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="72" cy="58" r="22" fill="url(#sunCore)" filter="url(#sunGlowFilter)"/>
    <circle cx="72" cy="58" r="13" fill="#FFF9E8"/>

    <g stroke="#FFD36E" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
      <line x1="72" y1="16" x2="72" y2="4"/>
      <line x1="72" y1="100" x2="72" y2="112"/>
      <line x1="30" y1="58" x2="18" y2="58"/>
      <line x1="114" y1="58" x2="126" y2="58"/>
      <line x1="42" y1="28" x2="34" y2="20"/>
      <line x1="102" y1="28" x2="110" y2="20"/>
      <line x1="42" y1="88" x2="34" y2="96"/>
      <line x1="102" y1="88" x2="110" y2="96"/>
      <animateTransform attributeName="transform" type="rotate" from="0 72 58" to="360 72 58" dur="18s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ===================== CLOUD (arrives after sun fades) ===================== -->
  <g id="cloud-group" opacity="0" filter="url(#cloudBlur)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.583;0.933;0.967;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="-60,0;-60,0;0,0;20,0;20,0;-60,0" keyTimes="0;0.5;0.583;0.85;0.967;1" dur="12s" repeatCount="indefinite"/>
    <ellipse cx="130" cy="46" rx="70" ry="26" fill="url(#cloudGrad)"/>
    <ellipse cx="190" cy="34" rx="46" ry="24" fill="url(#cloudGrad)"/>
    <ellipse cx="80" cy="40" rx="42" ry="20" fill="url(#cloudGrad)"/>
    <ellipse cx="250" cy="46" rx="40" ry="18" fill="url(#cloudGrad)"/>
  </g>

  <!-- ===================== RAIN (mild glowing streaks across the whole scene) ===================== -->
  <g id="rain-group" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.75;0.75;0;0" keyTimes="0;0.5;0.6;0.65;0.9;0.96;1" dur="12s" repeatCount="indefinite"/>

    <line x1="24" y1="0" x2="20" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.55" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="1.05s" begin="-0.05s" repeatCount="indefinite"/>
    </line>
    <line x1="68" y1="0" x2="64" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.5" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="0.95s" begin="-0.32s" repeatCount="indefinite"/>
    </line>
    <line x1="112" y1="0" x2="108" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.6" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="1.15s" begin="-0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="156" y1="0" x2="152" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.5" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="1.0s" begin="-0.87s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="0" x2="196" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.55" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="1.2s" begin="-0.18s" repeatCount="indefinite"/>
    </line>
    <line x1="244" y1="0" x2="240" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.5" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="0.9s" begin="-0.44s" repeatCount="indefinite"/>
    </line>
    <line x1="288" y1="0" x2="284" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.6" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="1.1s" begin="-0.71s" repeatCount="indefinite"/>
    </line>
    <line x1="332" y1="0" x2="328" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.5" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="1.0s" begin="-0.98s" repeatCount="indefinite"/>
    </line>
    <line x1="376" y1="0" x2="372" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.55" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="0.95s" begin="-0.25s" repeatCount="indefinite"/>
    </line>
    <line x1="420" y1="0" x2="416" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.5" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="1.15s" begin="-0.53s" repeatCount="indefinite"/>
    </line>
    <line x1="464" y1="0" x2="460" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.6" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="1.05s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="508" y1="0" x2="504" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.5" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="0.9s" begin="-0.1s" repeatCount="indefinite"/>
    </line>
    <line x1="552" y1="0" x2="548" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.55" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="1.2s" begin="-0.37s" repeatCount="indefinite"/>
    </line>
    <line x1="596" y1="0" x2="592" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.5" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="1.0s" begin="-0.64s" repeatCount="indefinite"/>
    </line>
    <line x1="640" y1="0" x2="636" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.6" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="1.1s" begin="-0.91s" repeatCount="indefinite"/>
    </line>
    <line x1="680" y1="0" x2="676" y2="13" stroke="#2EE6A6" stroke-width="2" stroke-linecap="round" opacity="0.5" filter="url(#rainGlow)">
      <animateTransform attributeName="transform" type="translate" values="0,-30;0,280" dur="0.95s" begin="-1.05s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===================== ORIGINAL PLANT ANIMATION (unchanged) ===================== -->
  <ellipse cx="350" cy="228" rx="95" ry="14" fill="url(#glowGrad)" opacity="0.4">
    <animate attributeName="opacity" values="0.25;0.55;0.25" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <path d="M308,200 L392,200 L378,238 L322,238 Z" fill="url(#potGrad)" stroke="#4a4f5b" stroke-width="1.5"/>
  <rect x="302" y="191" width="96" height="13" rx="4" fill="#3a3f4b" stroke="#4a4f5b" stroke-width="1.5"/>

  <path id="stem" d="M350,200 C331,160 369,148 350,110 C336,80 364,64 350,24"
        fill="none" stroke="#2EE6A6" stroke-width="4" stroke-linecap="round"
        pathLength="100" stroke-dasharray="100" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset"
              values="100;100;0;0;0;100"
              keyTimes="0;0.06;0.45;0.75;0.85;1"
              dur="7s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#glow)">
    <path d="M349,152 C328,146 311,156 300,172 C322,175 341,167 349,152 Z" fill="#2EE6A6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.16;0.21;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,8;0,8;0,0;0,0;0,0;0,8" keyTimes="0;0.16;0.21;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M352,152 C373,146 390,156 401,172 C379,175 360,167 352,152 Z" fill="#2EE6A6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.18;0.23;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,8;0,8;0,0;0,0;0,0;0,8" keyTimes="0;0.18;0.23;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M349,100 C331,95 316,104 306,118 C326,121 343,113 349,100 Z" fill="#2EE6A6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.28;0.33;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,8;0,8;0,0;0,0;0,0;0,8" keyTimes="0;0.28;0.33;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M352,100 C370,95 385,104 395,118 C375,121 358,113 352,100 Z" fill="#2EE6A6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.30;0.35;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,8;0,8;0,0;0,0;0,0;0,8" keyTimes="0;0.30;0.35;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="350" cy="24" r="0" fill="url(#glowGrad)" filter="url(#glow)">
    <animate attributeName="r" values="0;0;16;16;16;0" keyTimes="0;0.42;0.5;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="24" r="0" fill="#eafff5">
    <animate attributeName="r" values="0;0;6;6;6;0" keyTimes="0;0.44;0.52;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g fill="#2EE6A6">
    <circle cx="335" cy="60" r="2">
      <animate attributeName="cy" values="60;20;60" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="368" cy="80" r="1.8">
      <animate attributeName="cy" values="80;35;80" dur="2.6s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.6s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="90" r="1.5">
      <animate attributeName="cy" values="90;45;90" dur="3.6s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="3.6s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="375" cy="55" r="1.6">
      <animate attributeName="cy" values="55;15;55" dur="2.9s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="2.9s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="440" y="128" font-family="Poppins, Verdana, sans-serif" font-size="42" font-weight="700" fill="#2EE6A6" filter="url(#glow)" opacity="0">AgroSmart
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.42;0.5;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
  </text>
  <text x="440" y="158" font-family="Verdana, sans-serif" font-size="15" fill="#9aa0a8" opacity="0">A Next-Gen IoT Solution
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.5;0.58;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
  </text>
  <text x="440" y="180" font-family="Verdana, sans-serif" font-size="15" fill="#9aa0a8" opacity="0">for Smart Agriculture
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.52;0.6;0.75;0.85;1" dur="7s" repeatCount="indefinite"/>
  </text>
</svg>
